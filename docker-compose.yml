services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      CLIENT_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - clinic_logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  clinic_logs:
